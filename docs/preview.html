*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',system-ui,sans-serif;background:#f6fbf7;color:#1c1f26;line-height:1.75}
header{background:#04722b;color:#fff;padding:16px 20px;text-align:center;position:sticky;top:0;z-index:10;box-shadow:0 4px 12px rgba(0,0,0,.1)}
header h1{font-size:1.4rem;font-weight:800}
header h1 span{color:#ff6600}
header p{font-size:.9rem;opacity:.9;margin-top:4px}
main{max-width:1200px;margin:auto;padding:24px 16px}
.intro{background:#fff;border:1px solid #e2efe5;border-radius:14px;padding:20px;margin-bottom:24px;text-align:center;box-shadow:0 4px 12px rgba(4,114,43,.06)}
.intro h2{color:#04722b;font-size:1.3rem;margin-bottom:8px}
.intro p{color:#4b5160;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.card{background:#fff;border:1px solid #e2efe5;border-radius:14px;overflow:hidden;box-shadow:0 4px 14px rgba(4,114,43,.08);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(4,114,43,.15)}
.card img{width:100%;height:auto;aspect-ratio:1080/2401;object-fit:cover;display:block;background:#eaf3ec}
.card-body{padding:12px}
.card-title{font-weight:800;color:#04722b;font-size:.95rem;margin-bottom:8px;text-align:center}
.card-caption{font-size:.78rem;color:#4b5160;line-height:1.6;text-align:center;background:#f6fbf7;border-radius:8px;padding:8px 6px;border:1px dashed #cfe3d6}
.card-caption::before{content:"📢 ";font-size:.9rem}
footer{text-align:center;padding:32px 16px;color:#6b7280;font-size:.85rem;border-top:1px solid #e2efe5;margin-top:40px;background:#fff}
footer a{color:#04722b;text-decoration:none;font-weight:600}
@media(max-width:480px){
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  header h1{font-size:1.1rem}
  .intro h2{font-size:1.05rem}
  .card-body{padding:8px}
  .card-title{font-size:.82rem}
  .card-caption{font-size:.68rem;padding:6px 4px}
}
